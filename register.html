<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Генератор Номеров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="top-bar">
        <div id="profile-box">
            <!-- Блок регистрации (скрыт, пока идет загрузка) -->
            <div id="user-info" style="display: none; align-items: center; gap: 8px; margin-bottom: 4px;">
                <div id="user-avatar" style="width: 24px; height: 24px; border-radius: 50%; background: #0088cc; display: flex; justify-content: center; align-items: center; color: white; font-size: 12px;">?</div>
                <div id="user-name" style="font-size: 13px; color: #ffcc00; font-weight: bold;">Гость</div>
            </div>
            <div id="loading-status" style="font-size: 12px; color: #aaa;">Вход в аккаунт...</div>
            
            <div id="lvl-text">Уровень: 1</div>
            <div id="pts-text">Поинты: 0 / 100</div>
            <div id="xp-bar-container"><div id="xp-bar-fill"></div></div>
            <div id="balance-display">0 ₽</div>
        </div>
        <div class="top-btns">
            <div id="boost-indicator">⚡ x1.5 (10с)</div>
            <button class="icon-btn" id="btn-go-top">🏆</button>
            <button class="icon-btn" id="btn-open-bag">🎒<span id="bag-count">0</span></button>
            <button class="icon-btn" id="btn-open-settings">⚙️</button>
        </div>
    </div>
    
    <div id="main-screen">
        <div id="custom-gen-result">
            <div class="info-icon" id="btn-show-info">i</div>
        </div>
    </div>
    
    <div id="bottom-action-area">
        <button id="custom-gen-btn">Сгенерировать номер</button>
        <div id="action-btns-wrapper">
            <button class="btn-sell" id="btn-sell-now">Продать</button>
            <button class="btn-keep" id="btn-keep">Оставить</button>
        </div>
    </div>

    <!-- Рюкзак -->
    <div id="inventory-screen" class="full-screen">
        <div class="screen-header">
            <span style="font-weight:bold; font-size:18px;">🎒 Мой Рюкзак</span>
            <button class="btn-close" id="btn-close-bag">Закрыть</button>
        </div>
        <div id="inv-balance-box">
            <div style="font-size:14px; margin-bottom:5px;">Ваш баланс</div>
            <div id="inv-balance-amount" style="font-size:28px; font-weight:bold; color:#28a745;">0 ₽</div>
        </div>
        <button id="btn-sell-all">Продать все номера</button>
        <div id="inv-list"></div>
    </div>

    <!-- Настройки -->
    <div id="settings-screen" class="full-screen">
        <div class="screen-header">
            <span style="font-weight:bold; font-size:18px;">⚙️ Настройки</span>
            <button class="btn-close" id="btn-close-settings">Закрыть</button>
        </div>
        <div id="settings-content">
            <div class="setting-item">
                <span class="setting-text">Тёмная тема</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-theme">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Подключаем логику -->
    <script src="script.js"></script>
</body>
</html>
