<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лидеры</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAdZZjg-Tvmn8cs7Ticg2LNd_N-mDlqOTI",
            authDomain: "nomerki-gam3.firebaseapp.com",
            databaseURL: "https://nomerki-gam3-default-rtdb.firebaseio.com",
            projectId: "nomerki-gam3",
            storageBucket: "nomerki-gam3.firebasestorage.app",
            messagingSenderId: "582885790988",
            appId: "1:582885790988:web:ef8965c63a38da68d82529",
            measurementId: "G-8EGEPGFF4H"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const tg = window.Telegram ? window.Telegram.WebApp : null;
        let myId = "guest";
        if (tg) {
            tg.ready(); tg.expand();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                myId = tg.initDataUnsafe.user.id.toString();
            }
        }

        // Функция для отрисовки списка
        function renderLeaderboard(players) {
            const container = document.getElementById('leaderboard-list');
            container.innerHTML = '';

            if (players.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 20px; color: #aaa;">Пока нет игроков. Сгенерируйте номер в игре!</div>';
                return;
            }

            players.forEach((p, i) => {
                let rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
                let youClass = p.isYou ? 'you' : '';
                
                let div = document.createElement('div');
                div.className = `leader-item ${rankClass} ${youClass}`;
                
                // По клику открываем окно со статистикой
                div.onclick = () => showPlayerStats(p);
                div.style.cursor = 'pointer';
                
                div.innerHTML = `
                    <div class="leader-rank">#${i+1}</div>
                    <div class="leader-avatar">${p.avatar}</div>
                    <div class="leader-name">${p.name} ${p.isYou ? '(Вы)' : ''}</div>
                    <div class="leader-balance">${p.balance.toLocaleString('ru-RU')} ₽</div>
                `;
                container.appendChild(div);
            });
        }

        // Функция для показа статистики игрока
        function showPlayerStats(player) {
            let bestNumberDisplay = "Пока нет";
            let bestNumberPrice = "0 ₽";
            let bestNumberClass = "rarity-common";
            
            // Проверяем, есть ли у игрока лучший номер
            if (player.bestNumber) {
                bestNumberDisplay = player.bestNumber.phone;
                bestNumberPrice = player.bestNumber.price.toLocaleString('ru-RU') + ' ₽';
                // Определяем цвет редкости (упрощенно)
                if (player.bestNumber.category.includes("БРИЛЛИАНТОВЫЙ")) bestNumberClass = "rarity-diamond";
                else if (player.bestNumber.category.includes("ЗОЛОТОЙ")) bestNumberClass = "rarity-gold";
                else if (player.bestNumber.category.includes("СЕРЕБРЯНЫЙ")) bestNumberClass = "rarity-silver";
            }

            // Отрисовка Топ-3 рюкзака
            let top3Html = "";
            if (!player.inventory || player.inventory.length === 0) {
                top3Html = "Рюкзак пуст";
            } else {
                let sorted = [...player.inventory].sort((a, b) => b.price - a.price).slice(0, 3);
                top3Html = sorted.map((item, idx) => {
                    let itemColor = item.category.includes("БРИЛЛИАНТОВЫЙ") ? "rarity-diamond" :
                                    item.category.includes("ЗОЛОТОЙ") ? "rarity-gold" :
                                    item.category.includes("СЕРЕБРЯНЫЙ") ? "rarity-silver" : "rarity-common";
                    return `
                        <div class="profile-row">
                            <span class="${itemColor}" style="font-family: monospace;">${idx+1}. ${item.phone}</span>
                            <span style="color:#28a745;">${item.price.toLocaleString('ru-RU')} ₽</span>
                        </div>
                    `;
                }).join('');
            }

            // Заполняем модальное окно
            document.getElementById('stat-player-name').innerText = player.name;
            document.getElementById('stat-best-num').innerText = bestNumberDisplay;
            document.getElementById('stat-best-num').className = `best-num ${bestNumberClass}`;
            document.getElementById('stat-best-price').innerText = bestNumberPrice;
            document.getElementById('stat-top3').innerHTML = top3Html;
            
            document.getElementById('stat-generated').innerText = player.totalGenerated || 0;
            document.getElementById('stat-sold').innerText = player.totalSold || 0;
            document.getElementById('stat-current-balance').innerText = player.balance.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('stat-max-balance').innerText = (player.maxBalance || 0).toLocaleString('ru-RU') + ' ₽';

            // Показываем окно
            document.getElementById('stats-modal').style.display = 'flex';
        }

        const playersRef = ref(db, 'players');
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val();
            let players = [];

            if (data) {
                for (let id in data) {
                    let p = data[id];
                    players.push({
                        id: id,
                        name: p.name || "Игрок",
                        balance: p.balance || 0,
                        avatar: (p.name || "И").charAt(0).toUpperCase(),
                        isYou: id === myId,
                        bestNumber: p.bestNumber || null,
                        inventory: p.inventory || [],
                        totalGenerated: p.totalGenerated || 0,
                        totalSold: p.totalSold || 0,
                        maxBalance: p.maxBalance || 0
                    });
                }
            }

            // Сортируем по балансу
            players.sort((a, b) => b.balance - a.balance);
            
            // Оставляем ТОП-50
            players = players.slice(0, 50);

            renderLeaderboard(players);
        });
    </script>

    <style>
        :root { --bg-color: #f0f0f0; --card-bg: #ffffff; --text-main: #1e1e1e; --text-sub: #666; }
        body.dark-theme { --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #ffffff; --text-sub: #aaaaaa; }
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.4s, color 0.4s; height: 100vh; display: flex; flex-direction: column; }

        #top-bar { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; color: white; flex-shrink: 0; }
        .btn-close { background: #0088cc; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }

        #leaderboard-list { flex: 1; overflow-y: auto; padding: 15px; }
        
        .leader-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; margin-bottom: 10px; border-radius: 10px; background: var(--card-bg); box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: transform 0.1s; }
        .leader-item:active { transform: scale(0.98); }
        
        .leader-rank { font-size: 18px; font-weight: bold; width: 40px; color: var(--text-sub); }
        .leader-avatar { width: 32px; height: 32px; border-radius: 50%; background: #0088cc; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; margin-right: 10px; }
        .leader-name { flex: 1; font-weight: bold; }
        .leader-balance { font-weight: bold; color: #28a745; }

        /* ТОП 3 */
        .leader-item.top1 { background: linear-gradient(135deg, #fff8e1, #ffd700) !important; color: #1a1a1a !important; border: 2px solid #ffb300; box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
        .leader-item.top1 .leader-rank { color: #d4af37; font-size: 22px; }
        .leader-item.top1 .leader-avatar { background: #d4af37; }
        .leader-item.top1 .leader-balance { color: #1a1a1a; }

        .leader-item.top2 { background: linear-gradient(135deg, #f5f5f5, #c0c0c0) !important; color: #1a1a1a !important; border: 2px solid #9e9e9e; box-shadow: 0 0 10px rgba(192, 192, 192, 0.6); }
        .leader-item.top2 .leader-rank { color: #757575; font-size: 20px; }
        .leader-item.top2 .leader-avatar { background: #9e9e9e; }
        .leader-item.top2 .leader-balance { color: #1a1a1a; }

        .leader-item.top3 { background: linear-gradient(135deg, #fbe9e7, #cd7f32) !important; color: #1a1a1a !important; border: 2px solid #a0522d; box-shadow: 0 0 10px rgba(205, 127, 50, 0.6); }
        .leader-item.top3 .leader-rank { color: #8b4513; font-size: 20px; }
        .leader-item.top3 .leader-avatar { background: #8b4513; }
        .leader-item.top3 .leader-balance { color: #1a1a1a; }

        .leader-item.you { border: 2px solid #28a745 !important; background: rgba(40, 167, 69, 0.1); }

        /* МОДАЛЬНОЕ ОКНО СТАТИСТИКИ */
        #stats-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 99999999; display: none; justify-content: center; align-items: center; }
        #stats-content { background: var(--card-bg); padding: 20px; border-radius: 15px; width: 90%; max-height: 85vh; overflow-y: auto; color: var(--text-main); box-sizing: border-box; }
        
        .profile-section { background: var(--bg-color); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .profile-section h3 { margin-top: 0; color: #0088cc; font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .profile-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .profile-row span:last-child { font-weight: bold; }
        .best-num { font-family: monospace; font-size: 16px; font-weight: bold; text-align: center; padding: 10px; border-radius: 8px; background: rgba(0,136,204,0.1); margin-bottom: 5px; }
        
        .rarity-common { color: var(--text-main) !important; }
        .rarity-bronze { color: #cd7f32 !important; }
        .rarity-silver { color: #b0b0b0 !important; }
        .rarity-gold { color: #ffd700 !important; text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);}
        .rarity-diamond { color: #00ffff !important; text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);}
        
        .btn-close-modal { background: #dc3545; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; font-size: 16px;}
    </style>
</head>
<body>

    <div id="top-bar">
        <span style="font-weight:bold; font-size:18px;">🏆 Топ 50 игроков</span>
        <button class="btn-close" onclick="window.location.href='index.html'">В игру</button>
    </div>
    
    <div id="leaderboard-list">
        <div style="text-align:center; padding: 20px; color: #aaa;">Загрузка данных...</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО СТАТИСТИКИ -->
    <div id="stats-modal">
        <div id="stats-content">
            <h2 style="text-align: center; margin-top: 0; color: #0088cc;" id="stat-player-name">Игрок</h2>
            
            <div class="profile-section">
                <h3>🏅 Самый большой номер</h3>
                <div id="stat-best-num" class="best-num">Пока нет</div>
                <div class="profile-row"><span>Стоимость:</span> <span id="stat-best-price">0 ₽</span></div>
            </div>

            <div class="profile-section">
                <h3>🎒 Топ-3 номера в рюкзаке</h3>
                <div id="stat-top3" style="font-size: 14px;">Рюкзак пуст</div>
            </div>

            <div class="profile-section">
                <h3>📊 Статистика</h3>
                <div class="profile-row"><span>Всего сгенерировано:</span> <span id="stat-generated">0</span></div>
                <div class="profile-row"><span>Всего продано:</span> <span id="stat-sold">0</span></div>
                <div class="profile-row"><span>Текущий баланс:</span> <span id="stat-current-balance">0 ₽</span></div>
                <div class="profile-row"><span>Максимальный баланс:</span> <span id="stat-max-balance">0 ₽</span></div>
            </div>

            <button class="btn-close-modal" onclick="document.getElementById('stats-modal').style.display='none'">Закрыть</button>
        </div>
    </div>

    <script>
        if (localStorage.getItem('blum_theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }
    </script>
</body>
</html>
