<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лидеры</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        #leaderboard-list { flex: 1; overflow-y: auto; padding: 15px; }
        .leader-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; margin-bottom: 10px; border-radius: 10px; background: var(--card-bg); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .leader-item.you { border: 2px solid #28a745; background: rgba(40, 167, 69, 0.1); }
        .leader-rank { font-size: 18px; font-weight: bold; width: 40px; color: var(--text-sub); }
        .leader-avatar { width: 32px; height: 32px; border-radius: 50%; background: #0088cc; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; margin-right: 10px; }
        .leader-name { flex: 1; font-weight: bold; }
        .leader-balance { font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

    <div id="top-bar">
        <span style="font-weight:bold; font-size:18px;">🏆 Топ игроков</span>
        <button class="btn-close" onclick="window.location.href='index.html'" style="background: #0088cc;">Назад</button>
    </div>
    
    <div id="leaderboard-list"><div style="text-align:center; padding: 20px;">Загрузка...</div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAdZZjg-Tvmn8cs7Ticg2LNd_N-mDlqOTI",
            authDomain: "nomerki-gam3.firebaseapp.com",
            databaseURL: "https://nomerki-gam3-default-rtdb.firebaseio.com",
            projectId: "nomerki-gam3",
            storageBucket: "nomerki-gam3.firebasestorage.app",
            messagingSenderId: "582885790988",
            appId: "1:582885790988:web:ef8965c63a38da68d82529",
            measurementId: "G-8EGEPGFF4H"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const tg = window.Telegram ? window.Telegram.WebApp : null;
        let myId = "guest";
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            myId = tg.initDataUnsafe.user.id.toString();
        }

        // Слушаем базу данных в реальном времени
        const playersRef = ref(db, 'players');
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val();
            let players = [];
            
            if (data) {
                for (let id in data) {
                    let p = data[id];
                    players.push({
                        id: id,
                        name: p.name || "Игрок",
                        balance: p.balance || 0,
                        avatar: (p.name || "И").charAt(0).toUpperCase(),
                        isYou: id === myId
                    });
                }
            }

            // Сортировка по балансу
            players.sort((a, b) => b.balance - a.balance);

            let container = document.getElementById('leaderboard-list');
            container.innerHTML = '';
            
            if (players.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 20px;">Пока нет игроков</div>';
                return;
            }

            players.forEach((p, i) => {
                let youClass = p.isYou ? 'you' : '';
                let div = document.createElement('div');
                div.className = `leader-item ${youClass}`;
                div.innerHTML = `
                    <div class="leader-rank">#${i+1}</div>
                    <div class="leader-avatar">${p.avatar}</div>
                    <div class="leader-name">${p.name} ${p.isYou ? '(Вы)' : ''}</div>
                    <div class="leader-balance">${p.balance.toLocaleString('ru-RU')} ₽</div>
                `;
                container.appendChild(div);
            });

            if (localStorage.getItem('blum_theme') === 'dark') document.body.classList.add('dark-theme');
        });
    </script>
</body>
</html>
