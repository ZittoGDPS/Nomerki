<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лидеры</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        #leaderboard-list { flex: 1; overflow-y: auto; padding: 15px; }
        .leader-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; margin-bottom: 10px; border-radius: 10px; background: var(--card-bg); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .leader-item.you { border: 2px solid #28a745; background: rgba(40, 167, 69, 0.1); }
        .leader-rank { font-size: 18px; font-weight: bold; width: 40px; color: var(--text-sub); }
        .leader-avatar { width: 32px; height: 32px; border-radius: 50%; background: #0088cc; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; margin-right: 10px; }
        .leader-name { flex: 1; font-weight: bold; }
        .leader-balance { font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

    <div id="top-bar">
        <span style="font-weight:bold; font-size:18px;">🏆 Топ игроков</span>
        <button class="btn-close" onclick="window.location.href='index.html'" style="background: #0088cc;">Назад</button>
    </div>
    
    <div id="leaderboard-list"></div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); }

        // Получаем данные текущего игрока
        let myName = "Игрок";
        let myBalance = 0;
        
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            myName = tg.initDataUnsafe.user.first_name || "Игрок";
            
            // Синхронизируем баланс из облака
            if (tg.CloudStorage) {
                tg.CloudStorage.getItem("player_state", (err, data) => {
                    if (data && !err) {
                        try {
                            let parsed = JSON.parse(data);
                            myBalance = parsed.balance || 0;
                        } catch(e) {}
                    }
                    render(myName, myBalance);
                });
            } else {
                render(myName, myBalance);
            }
        } else {
            // Если в браузере
            myName = "Вы (Браузер)";
            myBalance = parseInt(localStorage.getItem('blum_balance')) || 0;
            render(myName, myBalance);
        }

        function render(name, balance) {
            // Сюда в будущем можно подключить Firebase для реальных людей
            // Пока что создаем имитацию, но с ВАШИМ реальным именем и балансом
            let players = [
                { name: "Александр", balance: 950000, avatar: "А" },
                { name: "Мария", balance: 720000, avatar: "М" },
                { name: "Дмитрий", balance: 450000, avatar: "Д" },
                { name: "Елена", balance: 310000, avatar: "Е" },
                { name: "Сергей", balance: 150000, avatar: "С" },
                { name: "Анна", balance: 80000, avatar: "А" },
                { name: name, balance: balance, avatar: name.charAt(0).toUpperCase(), isYou: true }
            ];

            players.sort((a, b) => b.balance - a.balance);

            let container = document.getElementById('leaderboard-list');
            container.innerHTML = '';
            
            players.forEach((p, i) => {
                let youClass = p.isYou ? 'you' : '';
                let div = document.createElement('div');
                div.className = `leader-item ${youClass}`;
                div.innerHTML = `
                    <div class="leader-rank">#${i+1}</div>
                    <div class="leader-avatar">${p.avatar}</div>
                    <div class="leader-name">${p.name} ${p.isYou ? '(Вы)' : ''}</div>
                    <div class="leader-balance">${p.balance.toLocaleString('ru-RU')} ₽</div>
                `;
                container.appendChild(div);
            });

            if (localStorage.getItem('blum_theme') === 'dark') document.body.classList.add('dark-theme');
        }
    </script>
</body>
</html>
