<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Mini App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем API Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1 id="greeting">Привет!</h1>
        <p>Это мое первое мини-приложение.</p>
        <button id="mainBtn">Нажми меня</button>
        <p id="result"></p>
    </div>
    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем на весь экран

        // Получаем данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('greeting').innerText = `Привет, ${user.first_name}!`;
        }

        // Обработка кнопки
        document.getElementById('mainBtn').addEventListener('click', () => {
            document.getElementById('result').innerText = 'Кнопка нажата! Данные отправлены в бота.';
            // Отправляем данные обратно в бота
            tg.sendData(JSON.stringify({ action: "button_clicked", time: Date.now() }));
        });
    </script>
</body>
</html>
