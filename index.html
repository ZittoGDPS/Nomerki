<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const finite=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d;
const fmt=n=>Math.floor(finite(n)).toLocaleString('ru-RU');
const money=n=>fmt(n)+' ₽';
const read=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const STORE='simkarta.save.v2', OLD_KEYS=['balance','inventory','theme','points','level','use_warning','warn_threshold','boost_mult','boost_end','best_number','total_generated','total_sold','max_balance','free_spins','operator','animation','simwall','username','profile_number','friends','current_gen','starter_granted','last_bonus_level','email_id','browser_id','user_name','sound'];
const keySafe=s=>String(s).replace(/[.#$\[\]\/]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase());
const digits=s=>String(s??'').replace(/\D/g,'');
const phoneKey=s=>{let d=digits(s);if(d.length===11&&'78'.includes(d[0]))d=d.slice(1);return d.length===10?d:null};
const list=v=>Array.isArray(v)?v:Object.values(v||{});
function cleanItem(x){if(!x?.phone)return null;return{phone:String(x.phone),price:Math.max(0,Math.floor(finite(x.price))),category:String(x.category||'Обычный'),chance:String(x.chance||''),reasons:Array.isArray(x.reasons)?x.reasons.map(String):[],lvl:Math.max(0,Math.min(5,Math.floor(finite(x.lvl))))}}

function fresh(){return{balance:100000,inventory:[],current:{phone:'+7 921 509-91-20',price:150,category:'Обычный',chance:'~50%',reasons:['Обычный номер без редких паттернов'],lvl:0,xp:0,xpPending:0},level:1,points:0,totalGenerated:0,totalSold:0,maxBalance:100000,bestNumber:null,freeSpins:10,operator:'Ёта',boostMult:1,boostEnd:0,wall:cleanWall(),username:'',profileNumber:'',friends:[],settings:{theme:'dark',animation:true,sound:true,warn:false,warnAt:100000},updatedAt:Date.now()}}
let isNewStarter = false;
function loadState(){let s=read(STORE,null);if(!s){const hasOld=localStorage.getItem('blum_balance')!==null;if(!hasOld) isNewStarter = true;s=fresh();if(hasOld){Object.assign(s,{balance:finite(localStorage.getItem('blum_balance'),100000),points:finite(localStorage.getItem('blum_points')),level:Math.max(1,finite(localStorage.getItem('blum_level'),1)),totalGenerated:finite(localStorage.getItem('blum_total_generated')),totalSold:finite(localStorage.getItem('blum_total_sold')),maxBalance:finite(localStorage.getItem('blum_max_balance')),freeSpins:finite(localStorage.getItem('blum_free_spins'),10),inventory:list(read('blum_inventory',[])).map(cleanItem).filter(Boolean),current:cleanItem(read('blum_current_gen',null)),bestNumber:cleanItem(read('blum_best_number',null)),wall:cleanWall(read('blum_simwall',null)),username:localStorage.getItem('blum_username')||'',profileNumber:localStorage.getItem('blum_profile_number')||'',friends:read('blum_friends',[])});s.settings.theme=localStorage.getItem('blum_theme')==='light'?'light':'dark';s.settings.animation=localStorage.getItem('blum_animation')!=='false';s.settings.warn=localStorage.getItem('blum_use_warning')==='true';s.settings.warnAt=finite(localStorage.getItem('blum_warn_threshold'),100000)}return s}const d=fresh(),out={...d,...s,settings:{...d.settings,...s.settings}};out.inventory=list(s.inventory).map(cleanItem).filter(Boolean);out.current=cleanItem(s.current);if(s.current){out.current.xp=Math.max(0,finite(s.current.xp));out.current.xpPending=Math.max(0,finite(s.current.xpPending))}out.bestNumber=cleanItem(s.bestNumber);out.wall=cleanWall(s.wall);out.friends=[...new Set(list(s.friends).map(String))];out.level=Math.max(1,Math.floor(finite(out.level,1)));out.points=Math.max(0,Math.floor(finite(out.points)));out.balance=Math.max(0,Math.floor(finite(out.balance)));out.maxBalance=Math.max(out.balance,Math.floor(finite(out.maxBalance)));out.freeSpins=Math.max(0,Math.floor(finite(out.freeSpins,10)));return out}
let state=loadState(), busy=false, currentView='', casinoIndex=null, mode=1, cloud=null, cloudReady=false, syncTimer=null, toastTimer=null, unsubMarket=null, unsubPayouts=null, genToken=0;
const tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand()}
let myId=keySafe(new URLSearchParams(location.search).get('user_id')||tg?.initDataUnsafe?.user?.id||localStorage.getItem('blum_email_id')||localStorage.getItem('blum_browser_id')||('browser_'+crypto.getRandomValues(new Uint32Array(1))[0]));
let myName=tg?.initDataUnsafe?.user?.first_name||localStorage.getItem('blum_user_name')||'Игрок';
if(!localStorage.getItem('blum_email_id'))try{localStorage.setItem('blum_browser_id',myId)}catch{}
const audio={ctx:null,play(freq=660,duration=.05){if(!state.settings.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx??=new AC();if(this.ctx.state==='suspended')this.ctx.resume();const o=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime;o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(this.ctx.destination);o.start();o.stop(t+duration)}catch{}}};

function rarity(cat){cat=String(cat||'');if(cat.includes('БРИЛЛИАНТ'))return['rarity-diamond',1000];if(cat.includes('ЗОЛОТ'))return['rarity-gold',150];if(cat.includes('СЕРЕБР'))return['rarity-silver',50];if(cat.includes('БРОНЗ'))return['rarity-bronze',25];if(cat.includes('УДАЧ'))return['rarity-lucky',30];return['rarity-common',cat.includes('КРАСИВ')?10:5]}

function priceNumber(num,type){const base={1:150,5:1250,20:10000}[type]||150,last2=num.slice(-2),last3=num.slice(-3),last4=num.slice(-4),reasons=[];let mult=1;const run=num.match(/(\d)\1{2,}/g)?.sort((a,b)=>b.length-a.length)[0];if(run){const n=run.length;mult*=({10:100000,9:10000,8:10000,7:2000,6:300,5:60,4:15,3:3})[n]||1;reasons.push(`${n} одинаковые цифры подряд`)}if(num===[...num].reverse().join('')){mult*=20;reasons.push('Зеркальный номер')}const seq=s=>{const d=Number(s[1])-Number(s[0]);return Math.abs(d)===1&&[...s].every((x,i)=>!i||Number(x)-Number(s[i-1])===d)};if(seq(last4)){mult*=8;reasons.push(`Последовательность ${last4}`)}else if(seq(last3)){mult*=3;reasons.push(`Последовательность ${last3}`)}if(last4[0]===last4[1]&&last4[2]===last4[3]&&last4[0]!==last4[2]){mult*=4;reasons.push(`Две пары ${last4}`)}if(last4[0]===last4[2]&&last4[1]===last4[3]&&last4[0]!==last4[1]){mult*=3;reasons.push(`Чередование ${last4}`)}if(num.endsWith('000')){mult*=2;reasons.push('Круглое окончание')}else if(num.endsWith('00')){mult*=1.4;reasons.push('Два нуля в конце')}if(last2[0]===last2[1]&&!reasons.length){mult*=1.5;reasons.push(`Пара ${last2}`)}if(!reasons.length)reasons.push('Обычный номер без редких паттернов');let price=Math.min(1e9,Math.max(base,Math.floor(base*mult)));const seven=new Date().getHours()===19&&num.endsWith('7');if(seven){price=Math.min(1e9,price*2);reasons.push('Час семёрок: цена ×2')}const cat=category(price),chance=cat==='Обычный'?'~50%':cat==='КРАСИВОЕ ОКОНЧАНИЕ'?'~30%':cat==='БРОНЗОВЫЙ'?'~15%':cat==='СЕРЕБРЯНЫЙ'?'~5%':cat==='ЗОЛОТОЙ'?'~1%':'< 0.001%';return{price,category:cat,chance,reasons}}

function makeNumber(type){const raw=randomNumber(),phone=`+7 ${raw.slice(0,3)} ${raw.slice(3,6)}-${raw.slice(6,8)}-${raw.slice(8)}`,data=priceNumber(raw,type),operators=[['Ёта',3],['Биглайн',2],['МСТ',1.5],['Могофон',1.2],['Тел 2',1]],op=operators[Math.floor(Math.random()*operators.length)];state.operator=op[0];const xp=Math.floor(rarity(data.category)[1]*op[1]*(Date.now()<state.boostEnd?state.boostMult:1));return{phone,...data,lvl:0,xp,xpPending:xp}}

async function fetchProfile(id){if(!cloudReady)return null;try{let s=await cloud.get(cloud.ref(cloud.db,'profiles/'+id));if(s.val())return s.val();s=await cloud.get(cloud.ref(cloud.db,'players/'+id));const d=s.val();return d?{...d,invCount:list(d.inventory).length}:null}catch{return null}}
async function loadLeaders(){const token=++viewToken;if(!cloudReady){leaderCache=[{id:myId,p:publicProfile()}];return renderView()}try{const s=await cloud.get(cloud.ref(cloud.db,'profiles')),d=s.val()||{},rows=Object.entries(d).map(([id,p])=>({id,p}));const i=rows.findIndex(x=>x.id===myId);if(i>=0)rows[i].p=publicProfile();else rows.push({id:myId,p:publicProfile()});if(token!==viewToken||currentView!=='leaders')return;leaderCache=rows.sort((a,b)=>finite(b.p.balance)-finite(a.p.balance)).slice(0,50);renderView()}catch{leaderCache=[{id:myId,p:publicProfile()}];if(currentView==='leaders')renderView()}}
async function loadFriends(){const token=++viewToken;if(!state.friends.length){friendCache=[];return}if(!cloudReady){friendCache=state.friends.map(id=>({id,p:null}));return renderView()}const rows=await Promise.all(state.friends.map(async id=>({id,p:await fetchProfile(id)})));if(token===viewToken&&currentView==='friends'){friendCache=rows;renderView()}}
async function showPlayer(id){profileView={id,p:id===myId?publicProfile():null};openScreen('player');if(id!==myId){const p=await fetchProfile(id);if(profileView?.id===id){profileView.p=p;renderView()}}}
async function saveUsername(){const raw=$('#username').value.trim().replace(/^@/,''),lower=raw.toLowerCase(),old=state.username.toLowerCase();if(raw&&!/^(?=.*[a-z])[a-z0-9_]{3,32}$/.test(lower))return toast('3–32 символа: латиница, цифры и _, минимум одна буква');if(!cloudReady)return toast('Для юзернейма нужно подключение к облаку');try{if(lower&&lower!==old){const r=await cloud.runTransaction(cloud.ref(cloud.db,'usernames/'+lower),cur=>cur===null||cur===myId?myId:undefined);if(!r.committed)return toast('Этот юзернейм уже занят')}if(old&&old!==lower)await cloud.runTransaction(cloud.ref(cloud.db,'usernames/'+old),cur=>cur===myId?null:undefined);state.username=raw;commit();toast('Юзернейм сохранён')}catch{toast('Не удалось сохранить юзернейм')}}
async function setProfileNumber(index){const it=state.inventory[index];if(!it)return;if(!cloudReady)return toast('Для публичного номера нужно облако');const key=phoneKey(it.phone),old=phoneKey(state.profileNumber);try{const r=await cloud.runTransaction(cloud.ref(cloud.db,'phoneIndex/'+key),cur=>cur===null||cur===myId?myId:undefined);if(!r.committed)return toast('Номер уже закреплён за другим игроком');if(old&&old!==key)await cloud.runTransaction(cloud.ref(cloud.db,'phoneIndex/'+old),cur=>cur===myId?null:undefined);state.profileNumber=it.phone;commit();openScreen('profile');toast('Номер закреплён в профиле')}catch{toast('Не удалось закрепить номер')}}
function enforceProfile(){if(state.profileNumber&&!state.inventory.some(x=>x.phone===state.profileNumber)){const key=phoneKey(state.profileNumber);state.profileNumber='';if(cloudReady&&key)cloud.runTransaction(cloud.ref(cloud.db,'phoneIndex/'+key),cur=>cur===myId?null:undefined).catch(()=>{})}}
async function findPlayer(q){q=q.trim();if(!cloudReady)throw new Error('cloud');let id;if(/^@|[^\d\s+\-().]/.test(q)){const name=q.replace(/^@/,'').toLowerCase();if(!/^(?=.*[a-z])[a-z0-9_]{3,32}$/.test(name))return null;id=(await cloud.get(cloud.ref(cloud.db,'usernames/'+name))).val()}else{const key=phoneKey(q);if(!key)return null;id=(await cloud.get(cloud.ref(cloud.db,'phoneIndex/'+key))).val()}return id?{id:String(id),p:await fetchProfile(String(id))}:null}
async function addFriend(){const input=$('#friendQuery'),q=input.value.trim();if(!q)return;try{const found=await findPlayer(q);if(!found?.p)return toast('Игрок не найден');if(found.id===myId)return toast('Это ваш профиль');if(state.friends.includes(found.id))return toast('Игрок уже в друзьях');if(state.friends.length>=100)return toast('Максимум 100 друзей');state.friends.push(found.id);input.value='';commit();await loadFriends();toast('Друг добавлен')}catch{toast('Не удалось найти игрока')}}
function subscribeMarket(){unsubMarket?.();marketCache=null;if(!cloudReady){marketCache=[];return renderView()}unsubMarket=cloud.onValue(cloud.ref(cloud.db,'market'),snap=>{const d=snap.val()||{};marketCache=Object.entries(d).filter(([,x])=>x?.phone).map(([key,x])=>({...x,key})).sort((a,b)=>b.price-a.price);if(currentView==='market')renderView()},()=>{marketCache=[];if(currentView==='market'){renderView();toast('Не удалось загрузить рынок')}})}
async function claimLot(key){let claimed=null;await cloud.runTransaction(cloud.ref(cloud.db,'market/'+key),cur=>{claimed=cur;return null});return claimed?.phone?claimed:null}
let marketBusy=false;
async function buyLot(key){if(marketBusy||!cloudReady)return;marketBusy=true;try{const preview=(await cloud.get(cloud.ref(cloud.db,'market/'+key))).val();if(!preview)return toast('Лот уже продан');if(preview.sellerId===myId)return;if(state.balance<preview.price)return toast('Недостаточно средств');if(!confirm(`Купить номер за ${money(preview.price)}?`))return;const lot=await claimLot(key);if(!lot)return toast('Лот уже продан');if(state.balance<lot.price){await cloud.set(cloud.ref(cloud.db,'market/'+key),lot);return toast('Недостаточно средств')}state.balance-=Math.floor(lot.price);state.inventory.push(cleanItem(lot));commit();if(lot.sellerId)await cloud.set(cloud.ref(cloud.db,`payouts/${keySafe(lot.sellerId)}/${Date.now()}_${key}`),{amount:Math.floor(lot.price*.95),phone:lot.phone,ts:Date.now()});toast('Номер куплен')}catch(e){console.warn(e);toast('Ошибка сделки. Проверьте рюкзак и повторите позже')}finally{marketBusy=false}}
async function takeLot(key){if(marketBusy||!cloudReady)return;marketBusy=true;try{const preview=(await cloud.get(cloud.ref(cloud.db,'market/'+key))).val();if(!preview||preview.sellerId!==myId)return toast('Лот недоступен');const lot=await claimLot(key);if(!lot)return;state.inventory.push(cleanItem({...lot,price:lot.originalPrice??lot.price}));commit();toast('Лот снят, номер возвращён')}catch{toast('Не удалось снять лот')}finally{marketBusy=false}}
async function listItem(index){const it=state.inventory[index];if(!it||!cloudReady)return toast('Для рынка нужно подключение к облаку');const raw=prompt(`Цена продажи (вы получите 95%):`,Math.floor(it.price*1.5));if(raw===null)return;const price=Math.floor(finite(raw));if(price<100||price>1e10)return toast('Цена: от 100 ₽ до 10 млрд ₽');const key=`${Date.now()}_${myId}`,lot={...it,price,originalPrice:it.price,sellerId:myId,sellerName:myName,timestamp:Date.now()};try{await cloud.set(cloud.ref(cloud.db,'market/'+key),lot);const i=state.inventory.indexOf(it);if(i>=0)state.inventory.splice(i,1);else{await cloud.remove(cloud.ref(cloud.db,'market/'+key));return toast('Номер уже использован')}enforceProfile();commit();toast('Лот выставлен на рынок')}catch{toast('Не удалось выставить лот — номер остался в рюкзаке')}}
function subscribePayouts(){unsubPayouts?.();if(!cloudReady)return;const base='payouts/'+myId,inflight=new Set();unsubPayouts=cloud.onValue(cloud.ref(cloud.db,base),snap=>{const d=snap.val()||{};Object.keys(d).forEach(async key=>{if(inflight.has(key))return;inflight.add(key);try{let claim=null;await cloud.runTransaction(cloud.ref(cloud.db,base+'/'+key),cur=>{claim=cur;return null});const amount=Math.floor(finite(claim?.amount));if(amount>0){state.balance+=amount;commit();toast(`Ваш номер купили: +${money(amount)}`)}}catch(e){console.warn(e)}finally{inflight.delete(key)}})})}
async function syncEmail(){const email=$('#syncEmail').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Введите корректный Email');if(!cloudReady)return toast('Нет подключения к облаку');const id=keySafe('email_'+email);try{const snap=await cloud.get(cloud.ref(cloud.db,'players/'+id)),data=snap.val();myId=id;myName=email.split('@')[0];localStorage.setItem('blum_email_id',id);localStorage.setItem('blum_user_name',myName);if(data)applyCloud(data);cloudReady=true;subscribePayouts();commit();closeScreen();toast(data?'Прогресс загружен':'Email привязан')}catch{toast('Не удалось синхронизировать')}}
function sellAll(){if(!state.inventory.length)return;const total=state.inventory.reduce((s,x)=>s+x.price,0);if(state.settings.warn&&total>=state.settings.warnAt&&!confirm(`Продать все номера за ${money(total)}?`))return;state.balance+=total;state.totalSold+=state.inventory.length;state.inventory=[];enforceProfile();commit();toast(`Получено ${money(total)}`)}
function slotBuy(i){if(i!==state.wall.slotsUnlocked)return;const cost=i*25000;if(state.balance<cost)return toast('Недостаточно средств');if(!confirm(`Открыть слот за ${money(cost)}?`))return;state.balance-=cost;state.wall.slotsUnlocked++;commit()}
function slotUpgrade(i){const it=state.wall.items[i];if(!it||it.lvl>=5)return;const cost=Math.max(1000,Math.round(it.price*.2*(it.lvl+1)));if(state.balance<cost)return toast('Недостаточно средств');state.balance-=cost;it.lvl++;commit();toast('Номер улучшен')}
function wallTick(){const now=Date.now();if(state.wall.lastTick>now)state.wall.lastTick=now;const mins=Math.floor((now-state.wall.lastTick)/60000);if(mins>0){const paid=Math.min(mins,1440),income=state.wall.items.reduce((s,x)=>s+wallIncome(x),0)*paid;state.wall.lastTick+=mins*60000;if(income>0){state.balance+=income;toast(`СИМ-стена: +${money(income)}`)}commit()}else if(currentView==='wall')renderView();const left=Math.max(0,Math.ceil((state.boostEnd-now)/1000));$('#boost').textContent=left?`⚡ Буст ×${state.boostMult} · ${left} с`:''}
async function resetProgress(){if(!confirm('Удалить прогресс Simkarta? Это действие нельзя отменить.'))return;busy=true;try{if(cloudReady){const old=state.username.toLowerCase(),pk=phoneKey(state.profileNumber);await Promise.allSettled([cloud.set(cloud.ref(cloud.db,'players/'+myId),null),cloud.set(cloud.ref(cloud.db,'profiles/'+myId),null),old?cloud.runTransaction(cloud.ref(cloud.db,'usernames/'+old),cur=>cur===myId?null:undefined):null,pk?cloud.runTransaction(cloud.ref(cloud.db,'phoneIndex/'+pk),cur=>cur===myId?null:undefined):null])}}catch{}try{localStorage.removeItem(STORE);OLD_KEYS.forEach(k=>localStorage.removeItem('blum_'+k))}catch{}location.reload()}
$('#buy').addEventListener('click',generate);$('#sellCurrent').addEventListener('click',sellCurrent);$('#keepCurrent').addEventListener('click',keepCurrent);$('#shop').addEventListener('change',render);$('#mode').addEventListener('click',()=>{mode=mode===1?3:mode===3?5:1;render()});$('#country').addEventListener('click',()=>toast('Россия · стандартный пул номеров'));$('#bag').addEventListener('click',()=>openScreen('inventory'));$('#menuBtn').addEventListener('click',openMenu);$('#menuClose').addEventListener('click',closeMenu);$('#scrim').addEventListener('click',closeMenu);$('#sheetClose').addEventListener('click',closeScreen);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheet').classList.contains('open'))closeScreen();else closeMenu()}});
$('#menu').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openScreen(b.dataset.open)});
$('#sheetBody').addEventListener('input',e=>{if(e.target.id==='casinoTarget')updateChance()});
$('#sheetBody').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='friendQuery')addFriend();if(e.key==='Enter'&&e.target.id==='username')saveUsername()});
$('#sheetBody').addEventListener('change',e=>{const id=e.target.id;if(id==='setTheme')state.settings.theme=e.target.checked?'light':'dark';else if(id==='setAnimation')state.settings.animation=e.target.checked;else if(id==='setSound')state.settings.sound=e.target.checked;else if(id==='setWarn')state.settings.warn=e.target.checked;else if(id==='setWarnAt')state.settings.warnAt=Math.max(0,Math.floor(finite(e.target.value,100000)));else return;commit()});
$('#sheetBody').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;audio.play();const d=b.dataset;if(d.sell!==undefined)return inventorySell(Number(d.sell));if(d.list!==undefined)return listItem(Number(d.list));if(d.slotBuy!==undefined)return slotBuy(Number(d.slotBuy));if(d.slotSet!==undefined){pickSlot=Number(d.slotSet);return openScreen('pick')}if(d.slotUp!==undefined)return slotUpgrade(Number(d.slotUp));if(d.slotRemove!==undefined){const it=state.wall.items[Number(d.slotRemove)];if(it){state.inventory.push(it);state.wall.items[Number(d.slotRemove)]=null;commit()}return}if(d.casino!==undefined){casinoIndex=Number(d.casino);return renderView()}if(d.marketBuy)return buyLot(d.marketBuy);if(d.marketTake)return takeLot(d.marketTake);if(d.player)return showPlayer(d.player);if(d.friendRemove){state.friends=state.friends.filter(x=>x!==d.friendRemove);commit();return loadFriends()}if(d.pick!==undefined){if(pickSlot!==null){const it=state.inventory[Number(d.pick)];if(!it||state.wall.items[pickSlot])return;state.inventory.splice(Number(d.pick),1);state.wall.items[pickSlot]=it;enforceProfile();pickSlot=null;commit();openScreen('wall')}else setProfileNumber(Number(d.pick));return}switch(b.dataset.action){case'sell-all':sellAll();break;case'upgrade':doUpgrade();break;case'save-username':saveUsername();break;case'profile-number':pickSlot=null;openScreen('pick');break;case'clear-profile-number':{const key=phoneKey(state.profileNumber);state.profileNumber='';if(cloudReady&&key)cloud.runTransaction(cloud.ref(cloud.db,'phoneIndex/'+key),cur=>cur===myId?null:undefined).catch(()=>{});commit();break}case'friend-add':addFriend();break;case'sync-email':syncEmail();break;case'reset':resetProgress();break}});
window.addEventListener('beforeunload',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
settleCurrent();render();persist();initCloud();setInterval(wallTick,1000);
if (isNewStarter) setTimeout(() => toast('🎁 Стартовый набор: +100 000 ₽!'), 500);
</script>
