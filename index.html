function priceNumber(num,type){
    const base={1:150,5:1250,20:10000}[type]||150;
    const last2=num.slice(-2),last3=num.slice(-3),last4=num.slice(-4),reasons=[];
    let mult=1;
    
    const run=num.match(/(\d)\1{2,}/g)?.sort((a,b)=>b.length-a.length)[0];
    if(run){
        const n=run.length;
        mult*=({10:100000,9:10000,8:10000,7:2000,6:300,5:60,4:15,3:3})[n]||1;
        reasons.push(`${n} одинаковые цифры подряд`);
    }
    if(num===[...num].reverse().join('')){mult*=20;reasons.push('Зеркальный номер')}
    const seq=s=>{const d=Number(s[1])-Number(s[0]);return Math.abs(d)===1&&[...s].every((x,i)=>!i||Number(x)-Number(s[i-1])===d)};
    if(seq(last4)){mult*=8;reasons.push(`Последовательность ${last4}`)}else if(seq(last3)){mult*=3;reasons.push(`Последовательность ${last3}`)}
    if(last4[0]===last4[1]&&last4[2]===last4[3]&&last4[0]!==last4[2]){mult*=4;reasons.push(`Две пары ${last4}`)}
    if(last4[0]===last4[2]&&last4[1]===last4[3]&&last4[0]!==last4[1]){mult*=3;reasons.push(`Чередование ${last4}`)}
    if(num.endsWith('000')){mult*=2;reasons.push('Круглое окончание')}else if(num.endsWith('00')){mult*=1.4;reasons.push('Два нуля в конце')}
    if(last2[0]===last2[1]&&!reasons.length){mult*=1.5;reasons.push(`Пара ${last2}`)}
    
    let price = Math.max(base, Math.floor(base*mult));
    
    if (price < 1000000) {
        const roll = Math.random() * 100;
        
        if (type === 1) { // Ларёк 1к
            if (roll < 5) { price = 1000000 + Math.random()*900000; reasons.push('Золотой (5%)'); }
            else if (roll < 20) { price = 100000 + Math.random()*900000; reasons.push('Серебряный (15%)'); }
            else if (roll < 45) { price = 10000 + Math.random()*90000; reasons.push('Бронзовый (25%)'); }
            else if (roll < 70) { price = 1000 + Math.random()*9000; reasons.push('Красивое (25%)'); }
            else { price = Math.max(150, Math.floor(Math.random()*850)); reasons.push('Обычный (30%)'); }
        } else if (type === 5) { // Магазин 5к
            if (roll < 5) { price = 1000000 + Math.random()*900000; reasons.push('Золотой (5%)'); }
            else if (roll < 25) { price = 100000 + Math.random()*900000; reasons.push('Серебряный (20%)'); }
            else if (roll < 55) { price = 10000 + Math.random()*90000; reasons.push('Бронзовый (30%)'); }
            else if (roll < 85) { price = 1000 + Math.random()*9000; reasons.push('Красивое (30%)'); }
            else { price = Math.max(150, Math.floor(Math.random()*850)); reasons.push('Обычный (15%)'); }
        } else if (type === 20) { // Ювелирный 20к
            if (roll < 7) { price = 1000000 + Math.random()*900000; reasons.push('Золотой (7%)'); }
            else if (roll < 32) { price = 100000 + Math.random()*900000; reasons.push('Серебряный (25%)'); }
            else if (roll < 67) { price = 10000 + Math.random()*90000; reasons.push('Бронзовый (35%)'); }
            else if (roll < 97) { price = 1000 + Math.random()*9000; reasons.push('Красивое (30%)'); }
            else { price = Math.max(150, Math.floor(Math.random()*850)); reasons.push('Обычный (3%)'); }
        }
    }
    
    const seven=new Date().getHours()===19&&num.endsWith('7');
    if(seven){price=Math.min(1e9,price*2);reasons.push('Час семёрок: цена ×2')}
    
    const cat=category(price);
    let chance = 'Зависит от режима';
    if(cat==='БРИЛЛИАНТОВЫЙ') chance = '< 0.001%';
    else if(cat==='ЗОЛОТОЙ') chance = type===20?'~7%':'~5%';
    else if(cat==='СЕРЕБРЯНЫЙ') chance = type===1?'~15%':type===5?'~20%':'~25%';
    else if(cat==='БРОНЗОВЫЙ') chance = type===1?'~25%':type===5?'~30%':'~35%';
    else if(cat==='КРАСИВОЕ ОКОНЧАНИЕ') chance = type===1?'~25%':type===5?'~30%':'~30%';
    else if(cat==='Обычный') chance = type===1?'~30%':type===5?'~15%':'~3%';
    
    return {price, category: cat, chance, reasons};
}

    unsubFriendAcc?.();
    
    unsubFriendReqs = cloud.onValue(cloud.ref(cloud.db, 'friendRequests/' + myId), snap => {
        const reqs = snap.val() || {};
        const oldReqs = state.incomingReqs || {};
        let hasNew = false;
        
        for (let id in reqs) {
            if (!oldReqs[id]) hasNew = true;
        }
        
        state.incomingReqs = reqs;
        persist();
        
        if (hasNew) {
            showRequestBanner();
            if (currentView === 'friends') renderView();
        }
    });

    unsubFriendAcc = cloud.onValue(cloud.ref(cloud.db, 'friend_accepted/' + myId), snap => {
        const acc = snap.val() || {};
        let added = false;
        
        Object.keys(acc).forEach(async key => {
            if (!state.friends.includes(key)) {
                state.friends.push(key);
                added = true;
                toast(`🎉 ${acc[key].name || 'Игрок'} принял вашу заявку в друзья!`);
            }
            await cloud.remove(cloud.ref(cloud.db, 'friend_accepted/' + myId + '/' + key));
        });
        
        if (added) {
            commit();
            if (currentView === 'friends') loadFriends();
        }
    });
}

function subscribeMarket(){unsubMarket?.();marketCache=null;if(!cloudReady){marketCache=[];return renderView()}unsubMarket=cloud.onValue(cloud.ref(cloud.db,'market'),snap=>{const d=snap.val()||{};marketCache=Object.entries(d).filter(([,x])=>x?.phone).map(([key,x])=>({...x,key})).sort((a,b)=>b.price-a.price);if(currentView==='market')renderView()},()=>{marketCache=[];if(currentView==='market'){renderView();toast('Не удалось загрузить рынок')}})}
async function claimLot(key){let claimed=null;await cloud.runTransaction(cloud.ref(cloud.db,'market/'+key),cur=>{claimed=cur;return null});return claimed?.phone?claimed:null}
let marketBusy=false;
async function buyLot(key){if(marketBusy||!cloudReady)return;marketBusy=true;try{const preview=(await cloud.get(cloud.ref(cloud.db,'market/'+key))).val();if(!preview)return toast('Лот уже продан');if(preview.sellerId===myId)return;if(state.balance<preview.price)return toast('Недостаточно средств');if(!confirm(`Купить номер за ${money(preview.price)}?`))return;const lot=await claimLot(key);if(!lot)return toast('Лот уже продан');if(state.balance<lot.price){await cloud.set(cloud.ref(cloud.db,'market/'+key),lot);return toast('Недостаточно средств')}state.balance-=Math.floor(lot.price);state.inventory.push(cleanItem(lot));commit();if(lot.sellerId)await cloud.set(cloud.ref(cloud.db,`payouts/${keySafe(lot.sellerId)}/${Date.now()}_${key}`),{amount:Math.floor(lot.price*.95),phone:lot.phone,ts:Date.now()});toast('Номер куплен')}catch(e){console.warn(e);toast('Ошибка сделки. Проверьте рюкзак и повторите позже')}finally{marketBusy=false}}
async function takeLot(key){if(marketBusy||!cloudReady)return;marketBusy=true;try{const preview=(await cloud.get(cloud.ref(cloud.db,'market/'+key))).val();if(!preview||preview.sellerId!==myId)return toast('Лот недоступен');const lot=await claimLot(key);if(!lot)return;state.inventory.push(cleanItem({...lot,price:lot.originalPrice??lot.price}));commit();toast('Лот снят, номер возвращён')}catch{toast('Не удалось снять лот')}finally{marketBusy=false}}
async function listItem(index){const it=state.inventory[index];if(!it||!cloudReady)return toast('Для рынка нужно подключение к облаку');const raw=prompt(`Цена продажи (вы получите 95%):`,Math.floor(it.price*1.5));if(raw===null)return;const price=Math.floor(finite(raw));if(price<100||price>1e10)return toast('Цена: от 100 ₽ до 10 млрд ₽');const key=`${Date.now()}_${myId}`,lot={...it,price,originalPrice:it.price,sellerId:myId,sellerName:myName,timestamp:Date.now()};try{await cloud.set(cloud.ref(cloud.db,'market/'+key),lot);const i=state.inventory.indexOf(it);if(i>=0)state.inventory.splice(i,1);else{await cloud.remove(cloud.ref(cloud.db,'market/'+key));return toast('Номер уже использован')}enforceProfile();commit();toast('Лот выставлен на рынок')}catch{toast('Не удалось выставить лот — номер остался в рюкзаке')}}
function subscribePayouts(){unsubPayouts?.();if(!cloudReady)return;const base='payouts/'+myId,inflight=new Set();unsubPayouts=cloud.onValue(cloud.ref(cloud.db,base),snap=>{const d=snap.val()||{};Object.keys(d).forEach(async key=>{if(inflight.has(key))return;inflight.add(key);try{let claim=null;await cloud.runTransaction(cloud.ref(cloud.db,base+'/'+key),cur=>{claim=cur;return null});const amount=Math.floor(finite(claim?.amount));if(amount>0){state.balance+=amount;commit();toast(`Ваш номер купили: +${money(amount)}`)}}catch(e){console.warn(e)}finally{inflight.delete(key)}})})}
function subscribeGifts(){
    unsubGifts?.();
    if(!cloudReady)return;
    const base='gifts/'+myId, inflight=new Set();
    unsubGifts=cloud.onValue(cloud.ref(cloud.db,base),snap=>{
        const d=snap.val()||{};
        Object.keys(d).forEach(async key=>{
            if(inflight.has(key))return;
            inflight.add(key);
            try{
                let claimed=null;
                await cloud.runTransaction(cloud.ref(cloud.db,base+'/'+key),cur=>{claimed=cur;return null});
                if(claimed && claimed.item){
                    state.inventory.push(cleanItem(claimed.item));
                    commit();
                    toast(`🎁 Подарок от ${claimed.senderName||'Игрока'}: ${claimed.item.phone}`);
                }
            }catch(e){console.warn(e)}
            finally{inflight.delete(key)}
        });
    });
}
async function syncEmail(){const email=$('#syncEmail').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Введите корректный Email');if(!cloudReady)return toast('Нет подключения к облаку');const id=keySafe('email_'+email);try{const snap=await cloud.get(cloud.ref(cloud.db,'players/'+id)),data=snap.val();myId=id;myName=email.split('@')[0];localStorage.setItem('nomerki_email_id',id);localStorage.setItem('nomerki_user_name',myName);if(data)applyCloud(data);cloudReady=true;subscribePayouts();subscribeGifts();subscribeFriendReqs();commit();closeScreen();toast(data?'Прогресс загружен':'Email привязан')}catch{toast('Не удалось синхронизировать')}}
function sellAll(){if(!state.inventory.length)return;const total=state.inventory.reduce((s,x)=>s+x.price,0);if(state.settings.warn&&total>=state.settings.warnAt&&!confirm(`Продать все номера за ${money(total)}?`))return;state.balance+=total;state.totalSold+=state.inventory.length;state.inventory=[];enforceProfile();commit();toast(`Получено ${money(total)}`)}
function slotBuy(i){if(i!==state.wall.slotsUnlocked)return;const cost=i*25000;if(state.balance<cost)return toast('Недостаточно средств');if(!confirm(`Открыть слот за ${money(cost)}?`))return;state.balance-=cost;state.wall.slotsUnlocked++;commit()}
function slotUpgrade(i){const it=state.wall.items[i];if(!it||it.lvl>=5)return;const cost=Math.max(1000,Math.round(it.price*.2*(it.lvl+1)));if(state.balance<cost)return toast('Недостаточно средств');state.balance-=cost;it.lvl++;commit();toast('Номер улучшен')}
function wallTick(){const now=Date.now();if(state.wall.lastTick>now)state.wall.lastTick=now;const mins=Math.floor((now-state.wall.lastTick)/60000);if(mins>0){const paid=Math.min(mins,1440),income=state.wall.items.reduce((s,x)=>s+wallIncome(x),0)*paid;state.wall.lastTick+=mins*60000;if(income>0){state.balance+=income;toast(`СИМ-стена: +${money(income)}`)}commit()}else if(currentView==='wall')renderView();const left=Math.max(0,Math.ceil((state.boostEnd-now)/1000));$('#boost').textContent=left?`⚡ Буст ×${state.boostMult} · ${left} с`:''}

async function resetProgress(){
    if(!confirm('Удалить прогресс Nomerki? Это действие нельзя отменить.'))return;
    resetting=true;
    busy=true;
    cloudReady=false;
    unsubFriendReqs?.();
    unsubFriendAcc?.();
    unsubPayouts?.();
    unsubGifts?.();
    unsubMarket?.();
    
    try{
        if(cloud && cloud.db){
            const old=state.username.toLowerCase(),pk=phoneKey(state.profileNumber);
            await Promise.allSettled([
                cloud.set(cloud.ref(cloud.db,'players/'+myId),null),
                cloud.set(cloud.ref(cloud.db,'profiles/'+myId),null),
                cloud.set(cloud.ref(cloud.db,'friendRequests/'+myId),null),
                cloud.set(cloud.ref(cloud.db,'friend_accepted/'+myId),null),
                cloud.set(cloud.ref(cloud.db,'gifts/'+myId),null),
                cloud.set(cloud.ref(cloud.db,'payouts/'+myId),null),
                old?cloud.runTransaction(cloud.ref(cloud.db,'usernames/'+old),cur=>cur===myId?null:undefined):null,
                pk?cloud.runTransaction(cloud.ref(cloud.db,'phoneIndex/'+pk),cur=>cur===myId?null:undefined):null
            ]);
        }
    }catch(e){ console.warn(e); }
    
    try{
        localStorage.removeItem(STORE);
        OLD_KEYS.forEach(k=>localStorage.removeItem('nomerki_'+k));
    }catch{}
    
    location.reload();
}

async function giftItem(index) {
    const it = state.inventory[index];
    if (!it || !cloudReady) return toast('Для подарка нужно подключение к облаку');
    
    const q = prompt(`Кому подарить номер ${it.phone}?\nВведите @юзернейм или номер из профиля друга:`, '');
    if (!q) return;

    try {
        const found = await findPlayer(q);
        if (!found || !found.p) return toast('Игрок не найден');
        if (found.id === myId) return toast('Нельзя подарить номер самому себе');
        
        if (!confirm(`Подарить номер ${it.phone} игроку ${found.p.name || 'Игрок'}?`)) return;

        state.inventory.splice(index, 1);
        enforceProfile();
        commit();

        const giftKey = `${Date.now()}_${myId}`;
        await cloud.set(cloud.ref(cloud.db, `gifts/${found.id}/${giftKey}`), {
            item: it,
            senderName: myName,
            ts: Date.now()
        });

        toast(`🎁 Подарок отправлен игроку ${found.p.name || 'Игрок'}!`);
        openScreen('inventory');
    } catch (e) {
        console.warn(e);
        toast('Не удалось отправить подарок');
        state.inventory.push(it);
        commit();
        openScreen('inventory');
    }
}

$('#infoBtn').addEventListener('click',()=>openScreen('info'));
$('#buy').addEventListener('click',generate);$('#sellCurrent').addEventListener('click',sellCurrent);$('#keepCurrent').addEventListener('click',keepCurrent);$('#shop').addEventListener('change',render);$('#country').addEventListener('click',()=>toast('Россия · стандартный пул номеров'));$('#bag').addEventListener('click',()=>openScreen('inventory'));$('#menuBtn').addEventListener('click',openMenu);$('#menuClose').addEventListener('click',closeMenu);$('#scrim').addEventListener('click',closeMenu);$('#sheetClose').addEventListener('click',closeScreen);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheet').classList.contains('open'))closeScreen();else closeMenu()}});
$('#menu').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openScreen(b.dataset.open)});
$('#sheetBody').addEventListener('input',e=>{if(e.target.id==='casinoTarget')updateChance()});
$('#sheetBody').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='friendQuery')addFriend();if(e.key==='Enter'&&e.target.id==='username')saveUsername()});
$('#sheetBody').addEventListener('change',e=>{const id=e.target.id;if(id==='setTheme')state.settings.theme=e.target.checked?'light':'dark';else if(id==='setAnimation')state.settings.animation=e.target.checked;else if(id==='setSound')state.settings.sound=e.target.checked;else if(id==='setWarn')state.settings.warn=e.target.checked;else if(id==='setWarnAt')state.settings.warnAt=Math.max(0,Math.floor(finite(e.target.value,100000)));else return;commit()});
$('#sheetBody').addEventListener('click',async e=>{
    const b=e.target.closest('button');
    if(!b||b.disabled)return;
    audio.play();
    const d=b.dataset;
    
    if (d.action && d.action.startsWith('admin-')) {
        if (!checkIsAdmin()) return toast('Доступ запрещен');
        if (d.action === 'admin-add-balance') { state.balance += 1000000; commit(); toast('Баланс пополнен на 1 млн'); return; }
        if (d.action === 'admin-set-balance') { const v = prompt('Новый баланс:', state.balance); if(v!==null) { state.balance = Math.max(0, parseInt(v)||0); commit(); } return; }
        if (d.action === 'admin-set-level') { const v = prompt('Новый уровень:', state.level); if(v!==null) { state.level = Math.max(1, parseInt(v)||1); state.points = 0; commit(); } return; }
        if (d.action === 'admin-add-spins') { state.freeSpins += 100; commit(); toast('+100 спинов'); return; }
        
        if (d.action === 'admin-spawn-diamond') { 
            state.current = { phone: '+7 999 999-99-99', price: 1000000000, category: 'БРИЛЛИАНТОВЫЙ', chance: '< 0.001%', reasons: ['Админ подарок'], lvl: 0, xp: 1000, xpPending: 1000 };
            commit(); closeScreen(); return; 
        }
        if (d.action === 'admin-spawn-gold') { 
            state.current = { phone: '+7 888 888-88-88', price: 1000000, category: 'ЗОЛОТОЙ', chance: '~5%', reasons: ['Админ подарок'], lvl: 0, xp: 150, xpPending: 150 };
            commit(); closeScreen(); return; 
        }
        if (d.action === 'admin-spawn-custom') {
            const phone = prompt('Введите номер (например +7 999 123-45-67):');
            if(!phone) return;
            const priceStr = prompt('Цена номера:');
            const price = Math.floor(finite(priceStr));
            state.current = { phone, price, category: category(price), chance: '100%', reasons: ['Админ подарок'], lvl: 0, xp: 50, xpPending: 50 };
            commit(); closeScreen(); return;
        }
        if (d.action === 'admin-reset-boost') { state.boostEnd = 0; state.boostMult = 1; commit(); toast('Буст сброшен'); return; }
        if (d.action === 'admin-force-sync') { queueSync(); toast('Синхронизация запущена'); return; }
        return;
    }

    if(d.sell!==undefined)return inventorySell(Number(d.sell));
    if(d.gift!==undefined)return giftItem(Number(d.gift));
    if(d.list!==undefined)return listItem(Number(d.list));
    if(d.slotBuy!==undefined)return slotBuy(Number(d.slotBuy));
    if(d.slotSet!==undefined){pickSlot=Number(d.slotSet);return openScreen('pick')}
    if(d.slotUp!==undefined)return slotUpgrade(Number(d.slotUp));
    if(d.slotRemove!==undefined){const it=state.wall.items[Number(d.slotRemove)];if(it){state.inventory.push(it);state.wall.items[Number(d.slotRemove)]=null;commit()}return}
    if(d.casino!==undefined){casinoIndex=Number(d.casino);return renderView()}
    if(d.marketBuy)return buyLot(d.marketBuy);
    if(d.marketTake)return takeLot(d.marketTake);
    if(d.player)return showPlayer(d.player);
    if(d.friendRemove){state.friends=state.friends.filter(x=>x!==d.friendRemove);commit();return loadFriends()}
    if(d.pick!==undefined){
        if(pickSlot!==null){
            const it=state.inventory[Number(d.pick)];
            if(!it||state.wall.items[pickSlot])return;
            state.inventory.splice(Number(d.pick),1);
            state.wall.items[pickSlot]=it;
            enforceProfile();pickSlot=null;commit();openScreen('wall')
        }else setProfileNumber(Number(d.pick));
        return
    }
    switch(b.dataset.action){
        case'sell-all':sellAll();break;
        case'upgrade':doUpgrade();break;
        case'save-username':saveUsername();break;
        case'profile-number':pickSlot=null;openScreen('pick');break;
        case'clear-profile-number':{const key=phoneKey(state.profileNumber);state.profileNumber='';if(cloudReady&&key)cloud.runTransaction(cloud.ref(cloud.db,'phoneIndex/'+key),cur=>cur===myId?null:undefined).catch(()=>{});commit();break}
        case'friend-add':addFriend();break;
        case'sync-email':syncEmail();break;
        case'reset':resetProgress();break;
    }
});
window.addEventListener('beforeunload',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
settleCurrent();render();persist();initCloud();setInterval(wallTick,1000);
if (isNewStarter) setTimeout(() => toast('🎁 Стартовый набор: +100 000 ₽!'), 500);
</script>
