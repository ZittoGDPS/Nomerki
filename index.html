DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Генератор Номеров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #f0f0f0; --card-bg: #ffffff; --text-main: #1e1e1e; --text-sub: #666; }
        body.dark-theme { --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #ffffff; --text-sub: #aaaaaa; }
        
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.4s, color 0.4s; height: 100vh; display: flex; flex-direction: column; }

        #top-bar { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; color: white; flex-shrink: 0; }
        #profile-box { display: flex; flex-direction: column; }
        #lvl-text { font-size: 14px; color: #00ff00; font-weight: bold; }
        #pts-text { font-size: 11px; color: #aaa; }
        #balance-display { font-size: 16px; font-weight: bold; color: #ffcc00; margin-top: 2px; }
        .top-btns { display: flex; gap: 8px; }
        .icon-btn { border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; background: #444; font-size: 16px; }

        /* Контейнер для карточки */
        #main-screen { flex: 1; padding: 15px; display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 100px; }
        
        /* Карточка с номером */
        #custom-gen-result { display: none; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; background: var(--card-bg); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .force-show { display: block !important; }
        .phone-number { font-size: 24px; font-weight: bold; margin-bottom: 5px; font-family: monospace; }
        .price-tag { font-size: 20px; color: #0088cc; font-weight: bold; margin-bottom: 5px; }
        .category-text { font-size: 14px; margin-bottom: 0; color: var(--text-sub); }
        
        /* Жестко фиксируем зону с кнопками внизу */
        #bottom-action-area { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            padding: 15px; 
            box-sizing: border-box; 
            background: var(--bg-color); 
            z-index: 100; 
        }
        
        #custom-gen-btn { color: white; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; width: 100%; background: #0088cc; box-sizing: border-box; }
        
        #action-btns-wrapper { display: none; gap: 10px; width: 100%; }
        .btn-sell { color: white; border: none; padding: 15px; border-radius: 10px; flex: 1; cursor: pointer; font-size: 16px; font-weight: bold; background: #28a745; }
        .btn-keep { background: #ffc107; color: #1e1e1e; border: none; padding: 15px; border-radius: 10px; flex: 1; cursor: pointer; font-size: 16px; font-weight: bold; }

        /* Цвета редкости */
        .rarity-common { color: var(--text-main) !important; }
        .rarity-bronze { color: #cd7f32 !important; text-shadow: 0 0 5px rgba(205, 127, 50, 0.3); }
        .rarity-silver { color: #b0b0b0 !important; text-shadow: 0 0 5px rgba(176, 176, 176, 0.5); }
        .rarity-gold { color: #ffd700 !important; text-shadow: 0 0 8px rgba(255, 215, 0, 0.5); }
        .rarity-diamond { color: #00ffff !important; text-shadow: 0 0 10px rgba(0, 255, 255, 0.8); font-weight: 900; }
        .rarity-lucky { color: #ff007f !important; text-shadow: 0 0 5px rgba(255, 0, 127, 0.5); }

        .full-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999999; display: none; flex-direction: column; background-color: var(--bg-color); }
        .screen-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; color: white; }
        .btn-close { background: #dc3545; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;}
        
        #inv-balance-box { margin: 15px; padding: 20px; border-radius: 10px; text-align: center; background: var(--card-bg); }
        #btn-sell-all { background: #dc3545; color: white; border: none; padding: 15px; margin: 0 15px 15px 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; width: calc(100% - 30px); }
        #btn-sell-all:disabled { background: #555; cursor: not-allowed; }
        #inv-list { flex: 1; overflow-y: auto; padding: 0 15px 15px 15px; }
        .inv-item { padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); }
        .btn-sell-item { background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        #settings-content { padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-radius: 10px; background: var(--card-bg); }
        .setting-text { font-size: 16px; font-weight: bold; }
        .warn-input-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; width: 100%; }
        .warn-input { flex: 1; padding: 12px; border-radius: 8px; font-size: 16px; box-sizing: border-box; width: 100%; border: 1px solid #ccc; background: #f9f9f9; color: black; }
        .warn-label { font-size: 14px; color: #888; }
        
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #28a745; }
        input:checked + .slider:before { transform: translateX(22px); }

        #toast-notification { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #ffcc00, #ff9900); color: #1e1e1e; padding: 15px 25px; border-radius: 12px; font-weight: bold; font-size: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 99999999; text-align: center; width: 85%; box-sizing: border-box; animation: slideDown 0.4s forwards; }
        @keyframes slideDown { from { top: -100px; opacity: 0; } to { top: 20px; opacity: 1; } }
    </style>
</head>
<body>

    <div id="top-bar">
        <div id="profile-box">
            <div id="lvl-text">Уровень: 1</div>
            <div id="pts-text">Поинты: 0 / 100</div>
            <div id="balance-display">0 ₽</div>
        </div>
        <div class="top-btns">
            <button class="icon-btn" id="btn-open-bag">🎒 <span id="bag-count">0</span></button>
            <button class="icon-btn" id="btn-open-settings">⚙️</button>
        </div>
    </div>
    
    <div id="main-screen">
        <div id="custom-gen-result"></div>
    </div>
    
    <!-- Зона кнопок внизу -->
    <div id="bottom-action-area">
        <button id="custom-gen-btn">Сгенерировать номер</button>
        <div id="action-btns-wrapper">
            <button class="btn-sell" id="btn-sell-now">Продать</button>
            <button class="btn-keep" id="btn-keep">Оставить</button>
        </div>
    </div>
    
    <div id="inventory-screen" class="full-screen">
        <div class="screen-header">
            <span style="font-weight:bold; font-size:18px;">🎒 Мой Рюкзак</span>
            <button class="btn-close" id="btn-close-bag">Закрыть</button>
        </div>
        <div id="inv-balance-box">
            <div style="font-size:14px; margin-bottom:5px;">Ваш баланс</div>
            <div id="inv-balance-amount" style="font-size:28px; font-weight:bold; color:#28a745;">0 ₽</div>
        </div>
        <button id="btn-sell-all">Продать все номера</button>
        <div id="inv-list"></div>
    </div>

    <div id="settings-screen" class="full-screen">
        <div class="screen-header">
            <span style="font-weight:bold; font-size:18px;">⚙️ Настройки</span>
            <button class="btn-close" id="btn-close-settings">Закрыть</button>
        </div>
        <div id="settings-content">
            <div class="setting-item">
                <span class="setting-text">Тёмная тема</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-theme">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item" style="flex-direction: column; align-items: flex-start;">
                <div style="display: flex; justify-content: space-between; width: 100%; margin-bottom: 5px; align-items: center;">
                    <span class="setting-text">Предупреждение при продаже</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-warning">
                        <span class="slider"></span>
                    </label>
                </div>
                <span style="font-size: 12px; margin-bottom: 10px; color: var(--text-sub);">Если стоимость номера равна или выше этой суммы, при продаже появится окно.</span>
                <div class="warn-input-group">
                    <span class="warn-label">Сумма от:</span>
                    <input type="number" id="input-warn-threshold" class="warn-input" placeholder="100000">
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let balance = parseInt(localStorage.getItem('blum_balance')) || 0;
        let inventory = JSON.parse(localStorage.getItem('blum_inventory')) || [];
        let isDarkTheme = localStorage.getItem('blum_theme') === 'dark';
        let points = parseInt(localStorage.getItem('blum_points')) || 0;
        let level = parseInt(localStorage.getItem('blum_level')) || 1;
        let useSellWarning = localStorage.getItem('blum_use_warning') === 'true';
        let warnThreshold = parseInt(localStorage.getItem('blum_warn_threshold')) || 100000;

        function saveData() {
            localStorage.setItem('blum_balance', balance);
            localStorage.setItem('blum_inventory', JSON.stringify(inventory));
            localStorage.setItem('blum_theme', isDarkTheme ? 'dark' : 'light');
            localStorage.setItem('blum_points', points);
            localStorage.setItem('blum_level', level);
            localStorage.setItem('blum_use_warning', useSellWarning);
            localStorage.setItem('blum_warn_threshold', warnThreshold);
        }

        const btnGen = document.getElementById('custom-gen-btn');
        const resultDiv = document.getElementById('custom-gen-result');
        const balanceDisplay = document.getElementById('balance-display');
        const lvlText = document.getElementById('lvl-text');
        const ptsText = document.getElementById('pts-text');
        const bagCount = document.getElementById('bag-count');
        const invScreen = document.getElementById('inventory-screen');
        const invList = document.getElementById('inv-list');
        const invBalanceAmount = document.getElementById('inv-balance-amount');
        const btnSellAll = document.getElementById('btn-sell-all');
        const settingsScreen = document.getElementById('settings-screen');
        const actionBtnsWrapper = document.getElementById('action-btns-wrapper');
        const btnSellNow = document.getElementById('btn-sell-now');
        const btnKeep = document.getElementById('btn-keep');
        const toggleTheme = document.getElementById('toggle-theme');
        const toggleWarning = document.getElementById('toggle-warning');
        const inputWarnThreshold = document.getElementById('input-warn-threshold');

        function getPointsForNextLevel(lvl) { return lvl * 100; }
        function getRarityClass(category) {
            if (category.includes("БРИЛЛИАНТОВЫЙ")) return "rarity-diamond";
            if (category.includes("ЗОЛОТОЙ")) return "rarity-gold";
            if (category.includes("СЕРЕБРЯНЫЙ")) return "rarity-silver";
            if (category.includes("БРОНЗОВЫЙ")) return "rarity-bronze";
            if (category.includes("УДАЧНЫЙ")) return "rarity-lucky";
            return "rarity-common";
        }

        function calculatePrice(fullNum) {
            let price = 150, category = "Обычный";
            let isBeautiful = false;
            if (/^(\d)\1{9}$/.test(fullNum)) { price = 1000000000; category = "БРИЛЛИАНТОВЫЙ"; isBeautiful = true; }
            else {
                let last4 = fullNum.slice(-4);
                if (last4 === "7777" || last4 === "8888" || last4 === "0000") { price = 5000000; category = "ЗОЛОТОЙ"; isBeautiful = true; }
                else if (/(\d)\1{2}/.test(fullNum)) { price = 150000; category = "СЕРЕБРЯНЫЙ"; isBeautiful = true; }
                else if (fullNum === fullNum.split('').reverse().join('')) { price = 300000; category = "ЗЕРКАЛЬНЫЙ"; isBeautiful = true; }
                else if (last4[0] === last4[1] && last4[2] === last4[3]) { price = 50000; category = "БРОНЗОВЫЙ"; isBeautiful = true; }
                else if (fullNum.includes("1234") || fullNum.includes("5678") || fullNum.includes("9876")) { price = 100000; category = "ПОСЛЕДОВАТЕЛЬНЫЙ"; isBeautiful = true; }
                else if (fullNum.slice(-2)[0] === fullNum.slice(-2)[1]) { price = 5000; category = "КРАСИВОЕ ОКОНЧАНИЕ"; }
            }
            if (!isBeautiful) {
                let luckyChance = level * 0.5;
                if (Math.random() * 100 < luckyChance) { price = Math.floor(Math.random() * 50000) + 10000; category = "УДАЧНЫЙ (Бонус уровня)"; }
            }
            if (price > 150) price += Math.floor(Math.random() * (price * 0.1)); 
            return { price: price, category: category };
        }

        function showToast(text) {
            let existingToast = document.getElementById('toast-notification');
            if (existingToast) existingToast.remove();
            let toast = document.createElement('div');
            toast.id = 'toast-notification'; toast.innerHTML = text;
            document.body.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
        }

        function updateUI() {
            let formattedBalance = balance.toLocaleString('ru-RU');
            balanceDisplay.innerText = formattedBalance + ' ₽';
            invBalanceAmount.innerText = formattedBalance + ' ₽';
            bagCount.innerText = inventory.length;
            lvlText.innerText = `Уровень: ${level}`;
            let ptsNeeded = getPointsForNextLevel(level);
            if (points >= ptsNeeded && level < 100) {
                points -= ptsNeeded; level++;
                showToast(`🎉 Новый уровень: ${level}!`);
                updateUI(); return;
            }
            ptsText.innerText = level >= 100 ? `Максимальный уровень!` : `Поинты: ${points} / ${ptsNeeded}`;
            btnSellAll.disabled = inventory.length === 0;
            btnSellAll.innerText = inventory.length === 0 ? "Рюкзак пуст" : "Продать все номера (" + inventory.length + ")";
            saveData();
        }

        // Теперь просто переключаем кнопки, карточку не трогаем
        function resetToGenerate() {
            btnGen.style.display = 'block';
            actionBtnsWrapper.style.display = 'none';
        }

        btnGen.onclick = function() {
            let fullNum = Math.floor(Math.random() * 10000000000).toString().padStart(10, '0');
            let finalPhone = `+7-${fullNum.substring(0, 3)}-${fullNum.substring(3, 6)}-${fullNum.substring(6, 8)}-${fullNum.substring(8, 10)}`;
            let evaluation = calculatePrice(fullNum);
            let currentGenerated = { phone: finalPhone, price: evaluation.price, category: evaluation.category };
            let colorClass = getRarityClass(evaluation.category);

            resultDiv.innerHTML = `
                <div class="phone-number ${colorClass}">${finalPhone}</div>
                <div class="price-tag">${evaluation.price.toLocaleString('ru-RU')} ₽</div>
                <div class="category-text">${evaluation.category}</div>
            `;
            resultDiv.classList.add('force-show');
            
            btnGen.style.display = 'none';
            actionBtnsWrapper.style.display = 'flex';

            let earnedXP = Math.floor(currentGenerated.price / 1000) + 5;
            points += earnedXP;
            updateUI();

            if (currentGenerated.price >= 100000) {
                showToast(`🔥 Дорогой номер!\n${currentGenerated.phone}\n${currentGenerated.price.toLocaleString('ru-RU')} ₽ (+${earnedXP} XP)`);
            }

            btnSellNow.onclick = function() {
                if (useSellWarning && currentGenerated.price >= warnThreshold) {
                    if (!confirm(`Продать за ${currentGenerated.price.toLocaleString('ru-RU')} ₽?`)) return;
                }
                balance += currentGenerated.price; updateUI(); resetToGenerate();
            };

            btnKeep.onclick = function() {
                inventory.push(currentGenerated); updateUI(); resetToGenerate();
            };
        };

        function renderInventory() {
            invList.innerHTML = '';
            if (inventory.length === 0) {
                invList.innerHTML = '<div style="text-align:center; margin-top:20px;">Рюкзак пуст.</div>';
                return;
            }
            [...inventory].reverse().forEach((item, index) => {
                let realIndex = inventory.length - 1 - index;
                let div = document.createElement('div');
                div.className = 'inv-item';
                let colorClass = getRarityClass(item.category);
                div.innerHTML = `
                    <div>
                        <div class="${colorClass}" style="font-weight:bold; font-family:monospace;">${item.phone}</div>
                        <div style="color:#28a745; font-size:14px; font-weight:bold;">${item.price.toLocaleString('ru-RU')} ₽</div>
                    </div>
                    <button class="btn-sell-item" data-index="${realIndex}">Продать</button>
                `;
                invList.appendChild(div);
            });
            document.querySelectorAll('.btn-sell-item').forEach(btn => {
                btn.onclick = function() {
                    let idx = parseInt(this.getAttribute('data-index'));
                    let item = inventory[idx];
                    if (useSellWarning && item.price >= warnThreshold) {
                        if (!confirm(`Продать за ${item.price.toLocaleString('ru-RU')} ₽?`)) return;
                    }
                    balance += item.price; inventory.splice(idx, 1); updateUI(); renderInventory();
                };
            });
        }

        document.getElementById('btn-open-bag').onclick = function() { invScreen.style.display = 'flex'; updateUI(); renderInventory(); };
        document.getElementById('btn-close-bag').onclick = function() { invScreen.style.display = 'none'; };
        document.getElementById('btn-open-settings').onclick = function() { settingsScreen.style.display = 'flex'; toggleTheme.checked = isDarkTheme; toggleWarning.checked = useSellWarning; inputWarnThreshold.value = warnThreshold; };
        document.getElementById('btn-close-settings').onclick = function() { settingsScreen.style.display = 'none'; };

        btnSellAll.onclick = function() {
            if (inventory.length === 0) return;
            let totalSum = inventory.reduce((sum, item) => sum + item.price, 0);
            if (useSellWarning && totalSum >= warnThreshold) {
                if (!confirm(`Продать ВСЕ на ${totalSum.toLocaleString('ru-RU')} ₽?`)) return;
            }
            balance += totalSum; inventory = []; updateUI(); renderInventory();
            showToast(`✅ +${totalSum.toLocaleString('ru-RU')} ₽`);
        };

        toggleTheme.onchange = function() { isDarkTheme = this.checked; applyTheme(); saveData(); };
        toggleWarning.onchange = function() { useSellWarning = this.checked; saveData(); };
        inputWarnThreshold.onchange = function() {
            let val = parseInt(this.value) || 100000; if (val < 0) val = 0;
            warnThreshold = val; this.value = val; saveData();
        };

        function applyTheme() {
            if (isDarkTheme) document.body.classList.add('dark-theme');
            else document.body.classList.remove('dark-theme');
        }

        applyTheme(); updateUI();
    </script>
</body>
</html
